  <rect x="112" y="20" width="28" height="28" fill="#0047AB" rx="2"/>

  <!-- Bottom-left position square -->
  <rect x="12" y="104" width="44" height="44" fill="none" stroke="#0047AB" stroke-width="3" rx="3"/>
  <rect x="20" y="112" width="28" height="28" fill="#0047AB" rx="2"/>

