  PLACEHOLDER QR CODE
  Replace this file with a real QR code generated from:
    https://qr-code-styling.com  or  https://www.qrcode-monkey.com

  Recommended settings:
    Data:       https://royalkingwater.in  (your actual URL)
    Size:       400×400
    Format:     SVG
    Color:      #0047AB (royal-blue)
    Background: #FFFFFF
    Logo:       optional water drop icon in center

  Save the generated file as public/qr.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" aria-label="QR Code placeholder">
  <rect width="160" height="160" fill="#ffffff" rx="8"/>

